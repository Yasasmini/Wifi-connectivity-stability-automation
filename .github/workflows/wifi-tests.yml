
name: WiFi Automation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run WiFi unit tests
        run: |
          python -m pytest tests/unit/ -v
      - name: Upload HTML test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wifi-html-report
          path: reports/report.html
          if-no-files-found: error

  delivery:
    needs: unit-tests
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tested code
        uses: actions/checkout@v4

      - name: Create source package
        run: |
          mkdir -p dist
          git archive --format=zip --output=dist/wifi-automation.zip HEAD

      - name: Upload delivery package
        uses: actions/upload-artifact@v4
        with:
          name: wifi-automation-package
          path: dist/wifi-automation.zip
          if-no-files-found: error
     
